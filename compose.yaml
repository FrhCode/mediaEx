services:
  mediaex:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ADMIN_NAME: ${ADMIN_NAME:?Set ADMIN_NAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      MEDIA_ROOT: /media
      DATA_DIR: /data
      STATIC_DIR: /app/web
      SCAN_INTERVAL: ${SCAN_INTERVAL:-15m}
      SCAN_SETTLE: ${SCAN_SETTLE:-30s}
      TOOL_TIMEOUT: ${TOOL_TIMEOUT:-30s}
      SPRITE_TIMEOUT: ${SPRITE_TIMEOUT:-2m}
      CONVERT_TIMEOUT: ${CONVERT_TIMEOUT:-2h}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MEDIA_MARKER: ${MEDIA_MARKER:-}
      # Caddy HTTPS requires COOKIE_SECURE=true and exact HTTPS PUBLIC_ORIGIN together.
      # TRUSTED_PROXIES should contain only the proxy's narrow CIDR for client rate limits.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:?Set MEDIA_HOST_PATH to your NAS folder}
        target: /media
        read_only: true
        bind:
          create_host_path: false
      - mediaex-data:/data
    # The image runs as uid/gid 10001. If your media folder is not world-readable,
    # uncomment the next line and use its numeric owner on the host (id -u, id -g) —
    # and keep the mediaex-data volume writable by that user (see README notes in .env.example).
    # user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  mediaex-data:
